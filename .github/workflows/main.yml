name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Download Il2CppDumper
      run: |
        wget https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.40/Il2CppDumper-v6.7.40.zip
        unzip Il2CppDumper-v6.7.40.zip -d dumper

    - name: Run Dumper
      run: |
        dotnet ./dumper/Il2CppDumper.dll libil2cpp.so global-metadata.dat output

    - name: Upload Dump Result
      uses: actions/upload-artifact@v3
      with:
        name: dump-result
        path: output/
        
