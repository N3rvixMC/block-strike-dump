name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Il2CppDumper
      run: |
        wget https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
        unzip Il2CppDumper-net6-v6.7.46.zip -d dumper

    - name: Bypass and Force Dump
      run: |
        # Metadata versiyonunu ve zorlamayı config'e işleyelim
        echo '{"AutoClose": true, "GenerateStruct": true, "GenerateDummyDll": true, "ForceDump": true, "DumpMethod": true, "DumpField": true, "DumpProperty": true, "DumpAttribute": true, "ampilkan": true}' > dumper/config.json
        
        cp libil2cpp.so dumper/
        cp global-metadata.dat dumper/
        
        cd dumper
        # Komut satırından unity versiyonunu zorlayarak geçmeyi deneyelim
        dotnet Il2CppDumper.dll libil2cpp.so global-metadata.dat output || true
        
        mkdir -p ../output
        cp -r output/* ../output/ || echo "Çıktı oluşmadı"

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
