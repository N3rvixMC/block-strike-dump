name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Clone and Build Official Dumper
      run: |
        git clone https://github.com/Perfare/Il2CppDumper.git
        cd Il2CppDumper/Il2CppDumper
        dotnet publish -c Release -o ../publish

    - name: Execute Dumper
      run: |
        mkdir -p output
        cd publish
        dotnet Il2CppDumper.dll ../libil2cpp.so ../global-metadata.dat ../output || true
        cd ../output
        ls -la

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
