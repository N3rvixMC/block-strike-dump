name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install and Run Il2CppDumper via dotnet tool
      run: |
        mkdir -p output
        dotnet tool install -g Il2CppDumper --version 6.7.46
        export PATH="$PATH:/home/runner/.dotnet/tools"
        
        il2cppdumper libil2cpp.so global-metadata.dat output || true
        ls -la output

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
