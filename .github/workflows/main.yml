name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Stable Release Zip
      run: |
        wget https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-v6.7.46.zip
        unzip Il2CppDumper-v6.7.46.zip -d dumper

    - name: Execute Dumper
      run: |
        mkdir -p output
        cd dumper
        dotnet Il2CppDumper.dll ../libil2cpp.so ../global-metadata.dat ../output || true
        cd ../output
        ls -la

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
