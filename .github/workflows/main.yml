name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Clone and Build Source Directly
      run: |
        git clone https://github.com/Perfare/Il2CppDumper.git
        cd Il2CppDumper/Il2CppDumper
        dotnet build -c Release
        cd bin/Release/net8.0
        
        mkdir -p ../../../../output
        ./Il2CppDumper ../../../../libil2cpp.so ../../../../global-metadata.dat ../../../../output || true
        
        cd ../../../../output
        ls -la

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
