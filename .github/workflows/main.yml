name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Il2CppDumper
      run: |
        wget https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
        unzip Il2CppDumper-net6-v6.7.46.zip -d dumper

    - name: Find files and Run Dumper
      run: |
        echo "Bulunan dosyalar:"
        find . -name "libil2cpp.so"
        find . -name "global-metadata.dat"
        
        # Dosyaları dumper klasörüne kopyalayıp garantiye alalım
        find . -name "libil2cpp.so" -exec cp {} dumper/ \;
        find . -name "global-metadata.dat" -exec cp {} dumper/ \;
        
        cd dumper
        dotnet Il2CppDumper.dll libil2cpp.so global-metadata.dat output
        mkdir -p ../output
        cp -r output/* ../output/

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
