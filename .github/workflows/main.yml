name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Il2CppDumper
      run: |
        curl -s https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest \
        | grep "browser_download_url.*zip" \
        | cut -d : -f 2,3 \
        | tr -d \" \
        | wget -qi -
        unzip Il2CppDumper-*.zip -d dumper

    - name: Run Dumper
      run: |
        dotnet ./dumper/Il2CppDumper.dll libil2cpp.so global-metadata.dat output

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
