name: Run Il2CppDumper

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Il2CppDumper
      run: |
        wget https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
        unzip Il2CppDumper-net6-v6.7.46.zip -d dumper

    - name: Create Config everywhere
      run: |
        echo '{"AutoClose": true, "GenerateStruct": true, "GenerateDummyDll": true}' > config.json
        cp config.json ./dumper/

    - name: Run Dumper
      run: |
        dotnet ./dumper/Il2CppDumper.dll libil2cpp.so global-metadata.dat output

    - name: Upload Dump Result
      uses: actions/upload-artifact@v4
      with:
        name: dump-result
        path: output/
